name: Deploy Dev - Web Gateway

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: dranov220805/ltt-ltc-web-gateway
      SERVICE_NAME: ltt-ltc-web-gateway

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          docker build -f LTC.WebGateWay/Dockerfile -t $IMAGE_NAME:latest .
          docker push $IMAGE_NAME:latest

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      # Setup SSH - Connect to Swarm Manager (Server 1)
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 100.99.158.16 >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Test SSH (optional but recommended)
        run: |
          ssh -o StrictHostKeyChecking=no kaka-server@100.99.158.16 "echo SSH OK"

      # Deploy to Docker Swarm - Note: web-gateway is in ltt-ltc stack, not ltt-ltc-db
      - name: SSH Deploy to Swarm
        run: |
          ssh -o StrictHostKeyChecking=no kaka-server@100.99.158.16 << EOF
            set -e
            echo "Updating $SERVICE_NAME service in Docker Swarm..."
            docker service update --image $IMAGE_NAME:latest --force ltt-ltc_$SERVICE_NAME
            echo "Deployment complete!"
            docker service ps ltt-ltc_$SERVICE_NAME
          EOF
